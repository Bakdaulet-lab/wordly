name: wordly
description: "A Flutter app for learning English words with gamification."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.1
  supabase_flutter: ^2.3.0
  go_router: ^13.0.0
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  flutter_animate: ^4.3.0
  cached_network_image: ^3.3.0
  flutter_tts: ^4.2.0
  fl_chart: ^0.70.2
  share_plus: ^10.1.4
  get_it: ^8.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
